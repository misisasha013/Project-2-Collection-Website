<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapbook</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="notebook">
      <div class="page1">
        <div class="polaroid3"></div>
        <div class="polaroid4"></div>
        <div class="leaf"></div>
        <div class="butterfly"></div>
        <div class="outlinevertical"></div>
        <div class="note-box"></div>
      </div>

      <div class="page2">
        <div class="polaroid_large2"></div>
        <div class="linex"></div>
        <div class="stamps">
          <div class="stamp"></div>
          <div class="stamp"></div>
        </div>
        <div class="bigoutline"></div>
      </div>
      <a href="spread-1.html" class="arrow arrow-prev">
        <img src="images/arrowleft.png" alt="Previous page">
      </a>
      <a href="spread-3.html" class="arrow arrow-next">
        <img src="images/arrowright.png" alt="Next page">
      </a>
    </div>
  </body>
</html>
